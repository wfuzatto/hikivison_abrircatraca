name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/fechar-close-isapi-20261023
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "build.ps1"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Teste ISAPI simulado - sem conexao a catracas
        shell: powershell
        run: dotnet run --project .\\tests\\HikvisionAbrirCatraca.IsapiTests\\HikvisionAbrirCatraca.IsapiTests.csproj --configuration Release

      - name: Build, publish and optionally sign
        shell: powershell
        env:
          CODE_SIGN_PFX_BASE64: ${{ secrets.CODE_SIGN_PFX_BASE64 }}
          CODE_SIGN_PFX_PASSWORD: ${{ secrets.CODE_SIGN_PFX_PASSWORD }}
          CODE_SIGN_CERT_THUMBPRINT: ${{ secrets.CODE_SIGN_CERT_THUMBPRINT }}
          CODE_SIGN_TIMESTAMP_URL: ${{ vars.CODE_SIGN_TIMESTAMP_URL }}
          CODE_SIGN_CERT_STORE: ${{ vars.CODE_SIGN_CERT_STORE }}
          CODE_SIGN_REQUIRED: ${{ vars.CODE_SIGN_REQUIRED }}
        run: .\build.ps1

      - name: Show Authenticode status
        shell: powershell
        run: |
          $sig = Get-AuthenticodeSignature .\dist\HikvisionAbrirCatraca.exe
          Write-Host "Status: $($sig.Status)"
          if ($sig.SignerCertificate) {
            Write-Host "Subject: $($sig.SignerCertificate.Subject)"
            Write-Host "Issuer:  $($sig.SignerCertificate.Issuer)"
          }

      - name: Create ZIP
        shell: powershell
        run: Compress-Archive -Path .\dist\* -DestinationPath .\HikvisionAbrirCatraca-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HikvisionAbrirCatraca-win-x64
          path: HikvisionAbrirCatraca-win-x64.zip
          if-no-files-found: error
          retention-days: 30
